aid: celer-network
name: Celer Network
description: >-
  Celer Network is a blockchain interoperability protocol that enables seamless
  cross-chain experiences for dApps, assets, and users. Its flagship cBridge is a
  decentralized cross-chain asset bridge supporting 40+ blockchains with over $14B
  in cumulative transfer volume, and Celer IM (Inter-chain Messaging) is a
  framework for building multi-blockchain applications with efficient liquidity,
  coherent logic, and shared state. For developers, the cBridge gateway exposes a
  public gRPC-Web / REST API (sgn.gateway.v1.Web) for discovering supported
  chains and tokens, estimating cross-chain transfer fees, tracking transfer
  status, and withdrawing liquidity. Celer was surfaced as a portfolio company of
  Pantera Capital.
